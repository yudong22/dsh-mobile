name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build, test and lint (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The ubuntu-latest image already ships a complete Android SDK
      # (ANDROID_HOME=/usr/local/lib/android/sdk) including platform android-36 and
      # build-tools 36.0.0, which is exactly what this project needs. We deliberately
      # do NOT call android-actions/setup-android here: it rewrites the SDK layout of
      # an already-populated directory and fails.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:?not set on this runner}"
          ls "${ANDROID_HOME}/platforms/android-36" > /dev/null
          ls "${ANDROID_HOME}/build-tools/36.0.0" > /dev/null

      # `:shared:testAndroidHostTest` runs the whole commonTest suite on the JVM
      # (enabled by `withHostTest {}` in shared/build.gradle.kts). The iOS targets
      # cannot be compiled on Linux, so their tests are not part of this job.
      - name: Build, test and lint
        run: |
          ./gradlew \
            :shared:testAndroidHostTest \
            :androidApp:testDebugUnitTest \
            :androidApp:lintDebug \
            :androidApp:assembleDebug \
            --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/**
            shared/build/test-results/**
            androidApp/build/reports/tests/**
            androidApp/build/test-results/**
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
