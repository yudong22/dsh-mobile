name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build, test and lint (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # AGP resolves the exact platform/build-tools it needs from the installed SDK;
      # this step only pre-seeds them so the first Gradle run does not have to download.
      - name: Pre-install SDK platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # `:shared:testAndroidHostTest` runs the whole commonTest suite on the JVM
      # (enabled by `withHostTest {}` in shared/build.gradle.kts). The iOS targets
      # cannot be compiled on Linux, so their tests are not part of this job.
      - name: Build, test and lint
        run: |
          ./gradlew \
            :shared:testAndroidHostTest \
            :androidApp:testDebugUnitTest \
            :androidApp:lintDebug \
            :androidApp:assembleDebug \
            --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/**
            shared/build/test-results/**
            androidApp/build/reports/tests/**
            androidApp/build/test-results/**
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
