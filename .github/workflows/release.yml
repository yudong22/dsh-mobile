name: Android Release

# Build a GitHub Release whenever a tag like `v1.8.0` is pushed.
# The release APK is built and attached to the Release automatically, so the
# build output shows up under the repository's Releases page (not just as a
# transient workflow artifact).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build release APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest already ships the Android SDK (android-36 / build-tools 36.0.0),
      # matching this project's compileSdk/targetSdk. No setup-android step needed.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:?not set on this runner}"
          ls "${ANDROID_HOME}/platforms/android-36" > /dev/null
          ls "${ANDROID_HOME}/build-tools/36.0.0" > /dev/null

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Upload release APK
        uses: softprops/action-gh-release@v2
        with:
          # Use the tag message as the release body when present.
          generate_release_notes: true
          files: androidApp/build/outputs/apk/release/*.apk
