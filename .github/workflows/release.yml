name: Android Release

# Build a GitHub Release whenever a tag like `v1.8.2` is pushed.
# The release APK is built and attached to the Release automatically, so the
# build output shows up under the repository's Releases page (not just as a
# transient workflow artifact).
#
# The APK is signed with the project's release keystore, supplied via repository
# secrets. Without those secrets the build produces an *unsigned* APK and this
# workflow fails instead of publishing it: an unsigned or debug-signed artifact
# cannot be upgraded over and must never be presented as a Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# A re-pushed tag must not race an earlier run to create the same Release.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest already ships the Android SDK (android-36 / build-tools 36.0.0),
      # matching this project's compileSdk/targetSdk. No setup-android step needed.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:?not set on this runner}"
          ls "${ANDROID_HOME}/platforms/android-36" > /dev/null
          ls "${ANDROID_HOME}/build-tools/36.0.0" > /dev/null

      # Fail fast and clearly when signing material is missing, rather than
      # discovering it after the build produced an unusable artifact.
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.DSH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DSH_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DSH_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "${KEYSTORE_BASE64}" ] || missing="${missing} DSH_KEYSTORE_BASE64"
          [ -n "${STORE_PASSWORD}" ] || missing="${missing} DSH_KEYSTORE_PASSWORD"
          [ -n "${KEY_PASSWORD}" ] || missing="${missing} DSH_KEY_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::error::Missing release signing secret(s):${missing}. See Docs/release-signing.md."
            exit 1
          fi

      - name: Decode signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.DSH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DSH_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DSH_KEY_PASSWORD }}
        run: |
          set -eu
          props="${RUNNER_TEMP}/keystore.properties"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          umask 077
          {
            echo "storeFile=${RUNNER_TEMP}/release.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=dsh-release"
            echo "keyPassword=${KEY_PASSWORD}"
          } > "${props}"
          echo "DSH_KEYSTORE_PROPERTIES=${props}" >> "${GITHUB_ENV}"

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      # The release variant is unsigned when signing material is absent, so this
      # guard is what keeps an unusable artifact out of the Releases page.
      - name: Verify the APK is signed with the release key
        run: |
          set -eu
          apk=$(ls androidApp/build/outputs/apk/release/*.apk)
          echo "APK: ${apk}"
          APKSIGNER=$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)
          "${APKSIGNER}" verify --print-certs "${apk}"
          if ! "${APKSIGNER}" verify --print-certs "${apk}" | grep -q "CN=DeepSeek Harness Mobile"; then
            echo "::error::Release APK is not signed with the project release key."
            exit 1
          fi
          # A debug-signed artifact must never be published.
          if "${APKSIGNER}" verify --print-certs "${apk}" | grep -q "CN=Android Debug"; then
            echo "::error::Release APK is debug-signed; refusing to publish."
            exit 1
          fi

      - name: Upload release APK
        uses: softprops/action-gh-release@v2
        with:
          # The annotated tag message is the release body; fall back to generated notes.
          generate_release_notes: true
          files: androidApp/build/outputs/apk/release/*.apk
